apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: minimal
  meshConfig:
    trustDomain: learning.local
    defaultConfig:
      holdApplicationUntilProxyStarts: true
  values:
    pilot:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
    global:
      proxy:
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: "1", memory: 256Mi}